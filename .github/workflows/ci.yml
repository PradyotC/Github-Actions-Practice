name: CI Practice Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test Job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js Environment (Example)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Test Command
        run: |
          echo "Running mock tests for practice..."
          echo "All tests passed successfully!"
