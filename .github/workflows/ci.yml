name: CI Practice Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test Job
    runs-on: ubuntu-latest

    steps:
      - name: Set up Node.js Environment (Example)
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Verify Node version
        run: |
          echo "Node version:"
          node -v
          echo "npm version:"
          npm -v

      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Run Test Command
        run: |
          echo "Running mock tests for practice..."
          echo "All tests passed successfully!"
